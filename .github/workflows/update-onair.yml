name: Update public radio on-air information
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "beautifulsoup4>=4.12,<5"
      - name: Update only public metadata
        run: python scripts/update_onair.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/onair.json
          if ! git diff --cached --quiet; then
            git commit -m "Update public on-air metadata"
            git push
          fi
