name: Update public radio on-air information

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: update-onair
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install 'beautifulsoup4>=4.12,<5'

      - name: Update public metadata (restart after network failure)
        shell: bash
        run: |
          success=false
          for attempt in 1 2 3; do
            echo "Attempt ${attempt}/3"
            if python scripts/update_onair.py; then
              success=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo 'Retrying in 30 seconds...'
              sleep 30
            fi
          done
          if [ "$success" = false ]; then
            echo '::warning::On-air metadata fetch failed; keeping the existing file.'
          fi

      - name: Commit updated metadata
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/onair.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update public on-air metadata'
            git push
          else
            echo 'No metadata changes.'
          fi
