<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" role="img" aria-labelledby="horseTitle horseDesc">
  <title id="horseTitle">Чёрный мустанг в галопе — ПыЛь_ДоРоГ FM</title>
  <desc id="horseDesc">Профиль чёрного мустанга, скачущего вправо: четыре раздельные ноги с суставами и копытами, естественная голова с двумя ушами, грива и густой хвост. Анимация включается классом playing.</desc>
  <style>
    :root { --horse: #191919; --far: #343434; }
    .body { fill: var(--horse); }
    .far { fill: var(--far); }
    .near { fill: var(--horse); }
    .joint, .body-motion, .tail, .mane, .head-bob { transform-box: view-box; }
    .body-motion { transform-origin: 350px 120px; }
    .hind-far { transform-origin: 271px 150px; }
    .hind-near { transform-origin: 292px 150px; }
    .front-far { transform-origin: 407px 147px; }
    .front-near { transform-origin: 428px 145px; }
    .hind-far .shin { transform-origin: 205px 190px; }
    .hind-near .shin { transform-origin: 227px 196px; }
    .front-far .shin { transform-origin: 444px 191px; }
    .front-near .shin { transform-origin: 457px 187px; }
    .tail { transform-origin: 251px 103px; }
    .mane { transform-origin: 433px 55px; }
    .head-bob { transform-origin: 421px 72px; }
    .playing .body-motion { animation: mustang-body .82s ease-in-out infinite; }
    .playing .hind-far { animation: mustang-hind-far .82s ease-in-out infinite; }
    .playing .hind-near { animation: mustang-hind-near .82s ease-in-out infinite; }
    .playing .front-far { animation: mustang-front-far .82s ease-in-out infinite; }
    .playing .front-near { animation: mustang-front-near .82s ease-in-out infinite; }
    .playing .hind-far .shin { animation: mustang-back-knee .82s ease-in-out infinite -.18s; }
    .playing .hind-near .shin { animation: mustang-back-knee .82s ease-in-out infinite; }
    .playing .front-far .shin { animation: mustang-front-knee .82s ease-in-out infinite -.14s; }
    .playing .front-near .shin { animation: mustang-front-knee .82s ease-in-out infinite; }
    .playing .tail { animation: mustang-tail .82s ease-in-out infinite; }
    .playing .mane { animation: mustang-mane .82s ease-in-out infinite; }
    .playing .head-bob { animation: mustang-head .82s ease-in-out infinite; }
    @keyframes mustang-body { 0%,100%{transform:translateY(2px) rotate(-.6deg)} 32%{transform:translateY(-6px) rotate(1deg)} 63%{transform:translateY(-1px) rotate(-.3deg)} 84%{transform:translateY(3px) rotate(-.8deg)} }
    @keyframes mustang-hind-far { 0%,100%{transform:rotate(27deg)} 28%{transform:rotate(-23deg)} 60%{transform:rotate(-9deg)} 83%{transform:rotate(17deg)} }
    @keyframes mustang-hind-near { 0%,100%{transform:rotate(7deg)} 28%{transform:rotate(-38deg)} 61%{transform:rotate(21deg)} 83%{transform:rotate(40deg)} }
    @keyframes mustang-front-far { 0%,100%{transform:rotate(-27deg)} 28%{transform:rotate(-8deg)} 60%{transform:rotate(28deg)} 85%{transform:rotate(3deg)} }
    @keyframes mustang-front-near { 0%,100%{transform:rotate(21deg)} 28%{transform:rotate(-29deg)} 61%{transform:rotate(-11deg)} 85%{transform:rotate(37deg)} }
    @keyframes mustang-back-knee { 0%,100%{transform:rotate(11deg)} 29%{transform:rotate(-33deg)} 62%{transform:rotate(-8deg)} 84%{transform:rotate(24deg)} }
    @keyframes mustang-front-knee { 0%,100%{transform:rotate(-8deg)} 28%{transform:rotate(34deg)} 60%{transform:rotate(-27deg)} 85%{transform:rotate(-7deg)} }
    @keyframes mustang-tail { 0%,100%{transform:rotate(1deg)} 48%{transform:rotate(-10deg)} 78%{transform:rotate(5deg)} }
    @keyframes mustang-mane { 0%,100%{transform:rotate(-2deg)} 45%{transform:rotate(5deg)} 80%{transform:rotate(-4deg)} }
    @keyframes mustang-head { 0%,100%{transform:rotate(-1deg)} 38%{transform:rotate(2deg)} 73%{transform:rotate(-1.5deg)} }
    @media (prefers-reduced-motion: reduce) { .playing * { animation: none !important; } }
  </style>

  <g class="body-motion">
    <!-- Дальняя задняя нога: бедро, скакательный сустав, копыто. -->
    <g class="joint hind-far far">
      <path d="M261 139 C249 152 237 164 223 177 Q210 187 201 193 L207 206 Q225 201 243 191 Q264 179 279 159 Z"/>
      <g class="joint shin">
        <path d="M207 188 Q195 199 185 219 L170 240 177 246 192 233 Q210 220 218 202 Z"/>
        <path d="M172 238 L163 246 Q159 252 164 256 L187 256 188 250 177 244 Z"/>
      </g>
    </g>

    <!-- Дальняя передняя нога. -->
    <g class="joint front-far far">
      <path d="M396 137 Q402 154 416 167 Q429 178 443 193 L454 185 Q442 163 435 149 L422 135 Z"/>
      <g class="joint shin">
        <path d="M438 183 Q450 195 462 210 L480 236 489 232 477 205 Q470 190 450 181 Z"/>
        <path d="M480 230 L487 230 501 247 Q507 253 501 255 L482 255 476 242 Z"/>
      </g>
    </g>

    <!-- Густой хвост, направленный назад во время галопа. -->
    <g class="joint tail body">
      <path d="M257 102 C245 102 237 110 227 120 C209 134 193 140 172 137 C149 132 129 124 108 128 C132 132 146 144 166 149 C187 157 204 154 225 144 C239 138 249 123 260 113 Z"/>
      <path d="M167 146 Q148 148 129 141 C145 157 164 160 181 154 Z"/>
    </g>

    <!-- Сильный корпус: круп, округлённые рёбра, глубокая грудь. -->
    <path class="body" d="M245 105 C260 89 282 83 301 85 C331 86 355 92 376 92 C394 90 411 85 424 78 C439 81 448 95 444 112 C442 135 428 154 410 163 C391 172 370 168 347 165 C326 170 304 172 289 165 C273 168 258 157 249 148 C237 137 235 119 245 105 Z"/>
    <!-- Плечо и шея плавно соединены с корпусом. -->
    <path class="body" d="M394 117 C408 98 414 78 425 59 C433 43 443 37 454 39 C465 42 469 56 467 70 C463 89 452 104 445 124 L427 150 401 146 Z"/>

    <!-- Шея переходит в голову без резкого угла. -->
    <g class="joint head-bob">
      <path class="body" d="M430 68 Q433 52 442 43 Q450 37 459 39 Q468 43 475 50 Q478 61 486 70 C497 75 512 78 524 86 Q533 92 534 100 C534 106 528 110 519 111 L506 110 Q498 115 487 114 Q476 113 472 106 L461 98 Q453 92 443 93 Z"/>
      <!-- Два отдельных закруглённых конских уха, с естественным наклоном вперёд. -->
      <path class="body" d="M441 47 Q438 34 443 27 Q447 24 449 30 L453 44 Z"/>
      <path class="body" d="M454 43 Q453 31 459 25 Q463 23 465 29 L465 45 Z"/>
      <path d="M446 32 Q444 36 446 41" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M461 30 Q459 35 460 39" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Лоб, скулы и более объёмная, округлая конская морда. -->
      <path d="M472 58 Q476 69 485 76 Q495 79 504 84" fill="none" stroke="#383838" stroke-width="2" stroke-linecap="round"/>
      <path d="M506 105 Q517 108 527 103" fill="none" stroke="#666" stroke-width="1.6" stroke-linecap="round"/>
      <ellipse cx="481" cy="77" rx="3.2" ry="2.45" fill="#d0d0d0"/>
      <circle cx="481.6" cy="77" r="1.4" fill="#161616"/>
      <ellipse cx="521" cy="96" rx="3" ry="2.1" fill="#6e6e6e" transform="rotate(-14 521 96)"/>
    </g>

    <!-- Грива: заметные, но мягкие пряди в направлении бега. -->
    <g class="joint mane body">
      <path d="M439 50 C428 53 421 62 415 73 C410 83 400 92 387 95 C404 99 416 93 424 84 C416 99 405 108 394 110 C417 113 431 99 438 85 C436 104 426 116 415 122 C435 120 450 102 453 78 L456 51 Z"/>
      <path d="M442 44 Q433 43 426 35 Q428 47 437 54 Z"/>
    </g>

    <!-- Ближняя задняя нога с явным изгибом колена и копытом. -->
    <g class="joint hind-near near">
      <path d="M279 144 Q295 146 301 161 Q296 177 279 183 Q260 192 229 201 L222 187 Q248 170 258 158 Z"/>
      <g class="joint shin">
        <path d="M236 193 Q217 201 207 219 L195 243 205 249 Q217 235 227 223 L248 210 Z"/>
        <path d="M196 240 L187 251 Q185 257 192 258 L215 258 216 252 205 245 Z"/>
      </g>
    </g>

    <!-- Ближняя передняя нога и отчётливое копыто. -->
    <g class="joint front-near near">
      <path d="M419 136 Q433 140 440 154 Q444 169 459 188 L449 198 Q429 185 420 170 Q412 155 419 136 Z"/>
      <g class="joint shin">
        <path d="M450 185 Q468 196 485 214 L510 237 504 246 475 230 Q459 216 440 197 Z"/>
        <path d="M505 236 L518 246 Q526 251 525 257 L501 257 498 251 499 243 Z"/>
      </g>
    </g>
  </g>
</svg>
